[versions]
agp = "9.5.0"
coreKtx = "1.10.1"
appcompat = "1.6.1"
kotlin = "2.2.10"
composeBom = "2026.02.01"
tvFoundation = "1.0.0-alpha07"
tvMaterial = "1.0.0-alpha07"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
exoplayer = "2.19.1"
multidex = "2.0.1"
junit = "4.13.2"
recyclerview = "1.3.2"
material = "1.4.0"
# ⚠️ zxing 必须用 3.2.1：3.3.0+ 的 qrcode.encoder.Encoder 静态初始化引用了
#    java.nio.charset.StandardCharsets，那是 **API 19** 才有的类 → Android 4.3 上
#    直接 NoClassDefFoundError。3.2.1 全库 0 处引用，API 18 安全。
zxing = "3.2.1"
# Bouncy Castle 纯 Java TLS 栈：4.3 的系统 JSSE 太老（OpenSSL 1.0.1 时代），
# BC 是纯 Java 实现，不依赖系统 OpenSSL，API 16+ 都能跑。
# 用 jdk15on 坐标（Maven Central 上没有 -android 变体），字节码是 Java 5 级别，Dalvik 可跑。
bouncycastle = "1.70"
# Conscrypt：Google 的 BoringSSL JNI 封装，官方声明支持 **API 9+**，
# AAR 里自带 jni/armeabi-v7a/libconscrypt_jni.so（1.28MB）以及
# PreKitKatPlatformOpenSSLSocketImplAdapter（继承 4.3 的 OpenSSLSocketImpl），
# 就是为了在 4.3 这种没有 GCM 套件的老系统上补出现代 TLS。
# 见 app/src/main/java/work/luxiaoxiao/myembyhub/net/TlsStack.kt 的注释。
conscrypt = "2.5.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-tv-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tvFoundation" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-multidex = { group = "androidx.multidex", name = "multidex", version.ref = "multidex" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# 二维码生成：zxing core 是纯 Java 库，无 minSdk 限制，API 18 可用
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
exoplayer-core = { group = "com.google.android.exoplayer", name = "exoplayer-core", version.ref = "exoplayer" }
exoplayer-hls = { group = "com.google.android.exoplayer", name = "exoplayer-hls", version.ref = "exoplayer" }
exoplayer-dash = { group = "com.google.android.exoplayer", name = "exoplayer-dash", version.ref = "exoplayer" }
exoplayer-ui = { group = "com.google.android.exoplayer", name = "exoplayer-ui", version.ref = "exoplayer" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
# BC：jdk15on 坐标（Maven Central 无 -android 变体），字节码 Java 5 级别，Dalvik 可跑
bcprov = { group = "org.bouncycastle", name = "bcprov-jdk15on", version.ref = "bouncycastle" }
bctls = { group = "org.bouncycastle", name = "bctls-jdk15on", version.ref = "bouncycastle" }
# Conscrypt：老系统上的现代 TLS 栈（AAR，含 armeabi-v7a / x86 原生库）
conscrypt-android = { group = "org.conscrypt", name = "conscrypt-android", version.ref = "conscrypt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

